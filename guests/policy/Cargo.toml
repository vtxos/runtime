[package]
name = "policy"
version = "0.1.0"
edition = "2021"

# A component, not a server. It exports `enclave:rpc/service`: the runtime owns the socket and
# gRPC's framing, and calls it once per call with the messages as a stream.
[[bin]]
name = "policy"
path = "src/main.rs"

[features]
default = []

[dependencies]
# The runtime's WIT and the bindings to it: what this guest exports, and everything it asks of the
# runtime. Read from the runtime's own files, not a copy.
enclave-wit = { path = "../../wit" }
# The export's streams and futures, and `spawn`. The same version enclave-wit generates against.
wit-bindgen = { version = "0.51", features = ["async-spawn"] }
# The ASP client `run-task` drives: `wasi:http` requests and an executor over the WASI reactor.
wstd = "0.6"
http-body-util = "0.1"
prost = "0.13"
bytes = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

# Bitcoin
bitcoin = { version = "0.32", features = ["serde"] }

# Ark protocol
ark = { path = "../../crates/ark", features = ["signing"] }

# Crypto. No FROST here: the wallet key and its rounds are the runtime's, over `enclave:signer`.
parking_lot = "0.12"
k256 = { version = "0.13", features = ["arithmetic"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3"
hex = "0.4"
# The wallet's half of each round: the tests play the wallet, and the fake host plays the runtime.
threshold = { path = "../../crates/threshold", features = ["std"] }
rand = "0.8"
# The fake host's control interface, which the tests set up their runtime through.
enclave-wit = { path = "../../wit", features = ["fake-host"] }

# Runs on the HOST, so `protoc` here costs the wasm build nothing. Both generators are switched off
# in `build.rs`: what lands in the crate is prost messages and no transport.
[build-dependencies]
tonic-build = "0.12"
