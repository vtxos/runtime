[package]
name = "vtxos-client"
description = "A vtxos wallet's client: attested TLS to the enclave runtime, share-signed sign-in, FROST with the runtime's share, the policy guest's ceremonies and the ASP calls they relay."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
enclave-auth = { path = "../../../crates/enclave-auth" }
enclave-client = { path = "../../../crates/enclave-client" }
threshold = { path = "../../../crates/threshold", features = ["std", "ecdh"] }
# The sessions the guest drives, its exits, and arkd's messages.
ark = { path = "../../../crates/ark", features = ["signing"] }
# The way down to a VTXO for its exit: its branch ordered and finalized.
ark-core = "0.9"
bitcoin = "0.32"

k256 = { version = "0.13", default-features = false, features = ["arithmetic"] }
sha2 = "0.10"
hkdf = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = "1"
hex = "0.4"
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Transport: rustls with ring (pure Rust and assembly, no CMake for the NDK or iOS), hyper's HTTP/2
# client, and tonic's generated stubs over it. tonic's own transport is not used.
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# The ASP's certificates: the web PKI's roots, compiled in.
webpki-roots = "0.26"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
hyper = { version = "1", features = ["client", "http2"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio"] }
http = "1"
http-body-util = "0.1"
bytes = "1"
tower-service = "0.3"
tokio-stream = "0.1"
# 0.12, for prost 0.13: the arkd messages are `crates/ark`'s.
tonic = { version = "0.12", default-features = false, features = ["codegen", "prost"] }
prost = "0.13"

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
rcgen = "0.13"
# The runtime itself, in process (`enclave_runtime::testing`), for tests/runtime.rs.
enclave-runtime = { path = "../../../runtime", features = ["testing"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
