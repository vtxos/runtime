[package]
name = "enclave-auth"
description = "The runtime's sign-in protocol, one definition for both sides: the approval a wallet share signs, the /auth/* messages, the tenant id, and a client's state machine without I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
threshold = { path = "../threshold", features = ["std", "ecdh"] }
k256 = { version = "0.13", default-features = false, features = ["arithmetic"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
hex = "0.4"
base64 = "0.22"
rand_core = "0.6"
zeroize = { workspace = true }

[dev-dependencies]
rand_core = { version = "0.6", features = ["getrandom"] }
serde_json = "1"
