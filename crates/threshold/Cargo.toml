[package]
name = "threshold"
version = "0.1.0"
edition = "2021"

[lib]
name = "threshold"

[dependencies]
k256 = { version = "0.13", default-features = false, features = ["arithmetic", "schnorr"] }
sha2 = { version = "0.10", default-features = false }
elliptic-curve = { version = "0.13", default-features = false, features = ["sec1"] }
rand_core = { version = "0.6", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
hex-conservative = { version = "0.2", default-features = false, features = ["alloc"] }
# Threshold ECDH's key derivation (see src/ecdh.rs).
hkdf = { version = "0.12", default-features = false, optional = true }

[features]
default = []
std = ["k256/std", "sha2/std", "serde/std", "serde_json/std", "rand_core/std"]
# Two-party threshold ECDH: RFC 9380 hash-to-curve and HKDF. A feature, so a
# crate that only signs resolves neither.
ecdh = ["k256/hash2curve", "dep:hkdf"]

[dev-dependencies]
rand = "0.8"
criterion = "0.5"

[[bench]]
name = "crypto_ops"
harness = false
