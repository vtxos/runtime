[package]
name = "ark"
version = "0.1.0"
edition = "2021"

[lib]
name = "ark"
path = "src/lib.rs"

[dependencies]
ark-core = { version = "0.9", optional = true }
bitcoin = { version = "0.32", features = ["serde"], optional = true }
prost = { version = "0.13", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
rand = { version = "0.8", optional = true }
hex = { version = "0.4", optional = true }

[features]
default = []
# `exit`: building and finalizing a unilateral exit spend (src/exit.rs). ark-core and bitcoin only —
# no prost, no tonic-build, so a wallet can enable it without `protoc` on every cross-build host.
exit = ["ark-core", "bitcoin", "hex"]
# `signing`: the sessions that build with ark-core and hand out sighashes for FROST, plus arkd's prost
# message types. Builds for wasm32-wasip2 — this is what the policy guest enables.
signing = ["exit", "prost", "serde", "serde_json", "rand", "tonic-build"]

[build-dependencies]
tonic-build = { version = "0.12", optional = true }

# `tests/live_arkd.rs` only: a gRPC client against a real arkd. Never part of a library build.
[dev-dependencies]
tonic = "0.12"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tokio-stream = "0.1"
