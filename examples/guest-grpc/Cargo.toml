# A workspace of its own, with its own lock file and its own target directory,
# so a guest cannot share the runtime's dependency layer — the same arrangement
# `examples/guest-http` uses and for the same reason.
[workspace]

[package]
name = "guest-grpc"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "guest-grpc"
path = "src/main.rs"

[dependencies]
prost = { version = "0.14", default-features = false, features = ["derive", "std"] }
# `enclave:rpc/service`, read from the runtime's own WIT: the runtime ends gRPC, this guest sees
# messages.
wit-bindgen = { version = "0.51", features = ["async-spawn"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
