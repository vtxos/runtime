# A `policy-v*` tag is a policy release: policy.wasm, built by Nix
# (`nix build .#policy`), and its SHA256SUMS, attached to a GitHub release named
# after the tag. Anyone can rebuild it from the tag and compare. A tag with a
# hyphen (policy-v0.2.0-rc.1) is a prerelease, for a consumer to try before
# it pins.
#
# Published bare. A deployment's settings are written into the component when it
# is deployed (deploy/qemu-nitro/guest-env.py, or dev-enclave.sh --guest-env),
# which refuses a component that already carries some, and PCR16 is measured
# after that — so the sha256 here identifies the code, not any one deployment's
# PCR16.
name: Policy release

on:
  push:
    tags: ["policy-v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - run: nix build .#policy --out-link result
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out
          cp result/bin/policy.wasm out/
          (cd out && sha256sum policy.wasm > SHA256SUMS)
          pre=""; [[ "$GITHUB_REF_NAME" == *-*-* ]] && pre=--prerelease
          gh release create "$GITHUB_REF_NAME" $pre --title "$GITHUB_REF_NAME" --notes "policy.wasm, bare.
          sha256 \`$(cut -d' ' -f1 out/SHA256SUMS)\`

          Rebuild it and compare: \`nix build 'github:vtxos/runtime/$GITHUB_REF_NAME#policy' && sha256sum result/bin/policy.wasm\`"
          gh release upload "$GITHUB_REF_NAME" out/policy.wasm out/SHA256SUMS
