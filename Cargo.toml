[workspace]
resolver = "2"
members = [
    "crates/ark",
    "crates/enclave-auth",
    "crates/enclave-client",
    "crates/nitro-attestation",
    "crates/nitro-nsm",
    "crates/threshold",
    "guests/policy",
    "runtime",
    "wit",
]
# The policy component is a member, not a workspace of its own, so the
# path dependencies it builds with (crates/ark, crates/threshold) sit inside
# its workspace. Cargo hashes a path dependency inside the workspace by its
# relative path and one outside it by its absolute path, and that hash names
# every symbol: two checkouts in two directories would build two policy.wasm.
# The fake host is its own workspace (guests/fake-host): wasmtime must never be
# in what the wasm build resolves. So is the mobile client (clients/mobile): its
# networking and uniffi stay out of this lock, and its rustls provider out of
# the runtime's builds.
exclude = ["guests/fake-host", "clients/mobile"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/BitspendPayment/enclave-runtime"

[workspace.dependencies]
tokio       = { version = "1", default-features = false }
bytes       = "1"
tracing     = "0.1"
thiserror   = "1"
anyhow      = "1"
async-trait = "0.1"
futures     = "0.3"
parking_lot = "0.12"
siphasher   = "1"

# Scrubs key material on drop. Enclave memory is unreadable from outside, but
# key bytes should not outlive their use inside it either.
zeroize     = { version = "1", features = ["zeroize_derive"] }
# The anchor chain's hashes and the boot's state root.
blake3      = "1"
# AES-256-GCM, Ed25519 anchor signatures, HKDF key derivation. aws-lc-rs is
# the AWS-native, FIPS-capable stack — the same primitives KMS speaks.
aws-lc-rs   = { version = "1", default-features = false, features = ["aws-lc-sys"] }

aws-config             = { version = "1", default-features = false }
aws-sdk-s3             = { version = "1", default-features = false }
aws-smithy-runtime-api = "1"
aws-smithy-types       = "1"

wasmtime      = { version = "=44.0.0", default-features = false, features = ["component-model", "async", "runtime"] }
wasmtime-wasi = "=44.0.0"

[profile.release]
lto = "thin"
codegen-units = 1

# The policy component, for size: what the enclave loads and PCR16 measures.
# Built with `--profile wasm-release` so the runtime's own release profile is
# left as it was.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
